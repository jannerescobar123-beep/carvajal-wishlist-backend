spring.application.name=carvajal-wishlist-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wishlist_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
# JWT
# Use empty default so application won't fail to start when JWT_SECRET isn't provided.
# Prefer providing a secure secret via the JWT_SECRET environment variable in production.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
spring.jpa.open-in-view=false
